<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />

    <!-- Demo styles -->
    <style>
      html,
      body {
        position: relative;
        height: 60%;
      }

      body {
        background: #000;
        font-family:
          Helvetica Neue,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 14px;
        color: #fff;
        margin-top: 100px;
        padding: 0;
      }

      .swiper {
        width: 100%;
        height: 100%;
      }

      .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #444;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .swiper {
        margin-left: auto;
        margin-right: auto;
        padding: 75px;
      }

      .gallery-title {
        text-align: center;
        font-size: 30px;
        color: #fff;
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>

    <div class="header">
        <h1 class="gallery-title">
            Gallery Property
    </div>
    <!-- Swiper -->
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <img src="Asset/property-1.jpg" alt="Image 1" class="swiper-slide" />
        <img src="Asset/property-2.jpg" alt="Image 2" class="swiper-slide" />
        <img src="Asset/property-3.jpg" alt="Image 3" class="swiper-slide" />
        <img src="Asset/property-4.jpg" alt="Image 4" class="swiper-slide" />
        <img src="Asset/property-5.jpg" alt="Image 5" class="swiper-slide" />
        <img src="Asset/property-6.jpg" alt="Image 6" class="swiper-slide" />
        <img src="Asset/property-7.jpg" alt="Image 7" class="swiper-slide" />
        <img src="Asset/property-8.jpg" alt="Image 8" class="swiper-slide" />
        <img src="Asset/property-9.jpg" alt="Image 9" class="swiper-slide" />
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper('.mySwiper', {
        slidesPerView: 3,
        spaceBetween: 30,
        loop: true,
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
      });
    </script>
  </body>
</html>
